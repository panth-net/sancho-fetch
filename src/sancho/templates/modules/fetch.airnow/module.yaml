id: fetch.airnow
version: 1.1.1
type: fetch
coverage: us
catalog_tier: small
entrypoint: main.py:run
description: |-
  Real-time US air quality from EPA AirNow: AQI, ozone, PM2.5, and wildfire
  smoke by ZIP code or coordinates. Path-driven EPA AirNow client. Fetch real-
  time AQI by ZIP code or lat/lon, historical observations, and forecasts.
  Endpoints: - `/aq/observation/zipCode/current/` — current AQI by ZIP -
  `/aq/observation/latLong/current/` — current AQI by lat/lon -
  `/aq/observation/zipCode/historical/` — historical observation -
  `/aq/forecast/zipCode/` and `/aq/forecast/latLong/` — forecasts Note:
  historical date format is YYYY-MM-DDT00-0000 (dash before 0000, not colon).
  Auth via AIRNOW_API_KEY required.
managed_paths:
- module.yaml
- main.py
- api.py
- transform.py
- schema.sample.json
input_schema:
  type: object
  properties:
    endpoint:
      type: string
      description: 'AirNow endpoint URL. Default `/aq/observation/zipCode/current/`.

        '
      examples:
      - https://www.airnowapi.org/aq/observation/zipCode/current/
      - https://www.airnowapi.org/aq/observation/latLong/current/
      - https://www.airnowapi.org/aq/observation/zipCode/historical/
      - https://www.airnowapi.org/aq/forecast/zipCode/
    params:
      type: object
      description: 'Query parameters. Geo: `zipCode` OR `latitude`+`longitude`.

        `distance` (miles, default 25). For historical: `date` in

        YYYY-MM-DDT00-0000 format. `format=application/json`. Auth:

        AIRNOW_API_KEY auto-injected as `API_KEY`.

        '
output_schema:
  type: object
  required:
  - dataset_ref
  - endpoint
  - retrieved_at
