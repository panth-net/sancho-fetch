id: fetch.eia.series
version: 1.2.1
type: fetch
coverage: us
catalog_tier: large
entrypoint: main.py:run
description: |-
  US energy data from EIA: electricity generation and prices, natural gas,
  petroleum and gasoline prices, renewables, CO2 emissions. Path-driven EIA API
  v2 client. Supply a full `endpoint` URL and a free-form `params` dict for
  facets, frequency, date range, and pagination. Use `seriesid/{LEGACY_ID}` for
  v1-style series IDs (e.g. PET.RWTC.D) or `{route}/data/` for v2 routes with
  facets. catalog.json walks the full /v2 route tree (256 routes, 229 leaf
  datasets, 385 data columns) — coal, electricity, natural-gas, petroleum,
  international, nuclear, renewable, steo, etc. — with per-route facets and
  frequencies. Requires EIA_API_KEY.
managed_paths:
- module.yaml
- main.py
- api.py
- transform.py
- schema.sample.json
- catalog.json
- catalog.meta.json
- catalog_blueprint.py
- discovery.py
input_schema:
  type: object
  properties:
    endpoint:
      type: string
      description: 'Full EIA API URL. Use `seriesid/{LEGACY_ID}` for v1-style series
        IDs

        (e.g. PET.RWTC.D for daily WTI crude price) or `{route}/data/` for

        v2 routes with facets.

        '
      examples:
      - https://api.eia.gov/v2/seriesid/PET.RWTC.D
      - https://api.eia.gov/v2/electricity/electric-power-operational-data/data/
      - https://api.eia.gov/v2/natural-gas/prod/sum/data/
    params:
      type: object
      description: 'Query parameters dict. Common keys: `frequency` (annual/monthly/daily),

        `data[]` for column selection, `facets[FACET][]` for filters,

        `start`/`end` for date range, `sort[0][column]`+`sort[0][direction]`,

        `offset`/`length` for pagination.

        '
output_schema:
  type: object
  required:
  - dataset_ref
  - endpoint
  - retrieved_at
