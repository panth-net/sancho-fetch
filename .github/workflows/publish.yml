# Publish sancho-fetch to PyPI on version tags (v0.1.0, v0.1.1, ...).
#
# Auth is PyPI Trusted Publishing (OIDC) -- no API token is stored anywhere.
# One-time setup on pypi.org: Account -> Publishing -> add a pending
# publisher for project "sancho-fetch", repo "panth-net/sancho-fetch",
# workflow "publish.yml", environment "pypi".
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -m "not live and not slow"

      - name: Build sdist and wheel
        run: uv build

      - name: Check the wheel ships the bundled env template
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("sancho/templates/workspace/.env.example") for n in names), \
              ".env.example missing from wheel -- check [tool.setuptools.package-data]"
          templates = [n for n in names if "/templates/" in n]
          assert len(templates) > 600, f"only {len(templates)} template files in wheel"
          assert not [n for n in templates if n.endswith((".pyc", ".pyo"))], \
              "compiled artifacts leaked into the wheel"
          print(f"wheel OK: {len(templates)} template files")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
