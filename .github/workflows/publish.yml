name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install pinned MCP publisher and verify checksum
        run: |
          curl -fsSLo mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Verify tag, versions, MCPB, Registry metadata, and plugin
        run: |
          uv run python scripts/release_preflight.py --tag "$GITHUB_REF_NAME"
          uv run python scripts/validate_mcpb.py
          ./mcp-publisher validate server.json

      - name: Run release gates
        run: uv run pytest -m "not live and not slow"

      - name: Build sdist and wheel
        run: uv build

      - name: Check the wheel ships templates and no compiled artifacts
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("sancho/templates/workspace/.env.example") for n in names), \
              ".env.example missing from wheel -- check [tool.setuptools.package-data]"
          templates = [n for n in names if "/templates/" in n]
          assert len(templates) > 600, f"only {len(templates)} template files in wheel"
          assert not [n for n in templates if n.endswith((".pyc", ".pyo"))], \
              "compiled artifacts leaked into the wheel"
          print(f"wheel OK: {len(templates)} template files")
          EOF

      - name: Upload immutable Python candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/

      - name: Upload immutable MCPB candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcpb-candidate
          path: integrations/claude-desktop/sancho.mcpb

  wheel-lifecycle:
    needs: test-and-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: release-candidates
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Run installed-wheel lifecycle
        run: python scripts/wheel_lifecycle.py release-candidates

  publish-pypi:
    needs: [test-and-build, wheel-lifecycle]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: release-candidates
      - name: Publish exact candidates to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-candidates/
          skip-existing: true

  release-assets:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcpb-candidate
          path: release-candidates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: python-candidates
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Wait for the public wheel
        run: uv run python scripts/wait_for_pypi.py "${GITHUB_REF_NAME#v}" --wheel-dir python-candidates
      - name: Create or resume the GitHub release and upload MCPB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-candidates/sancho.mcpb --clobber

  publish-registry:
    needs: release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcpb-candidate
          path: release-candidates
      - name: Install pinned MCP publisher and verify checksum
        run: |
          curl -fsSLo mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Verify public MCPB and prepare final Registry document
        run: |
          python3 scripts/prepare_registry_release.py \
            --asset-url "https://github.com/panth-net/sancho-fetch/releases/download/$GITHUB_REF_NAME/sancho.mcpb" \
            --local-mcpb release-candidates/sancho.mcpb \
            --output release-candidates/server.release.json
          ./mcp-publisher validate release-candidates/server.release.json
      - name: Publish Registry metadata through GitHub OIDC
        run: |
          ./mcp-publisher login github-oidc
          python3 scripts/publish_registry_idempotent.py \
            release-candidates/server.release.json --publisher ./mcp-publisher
